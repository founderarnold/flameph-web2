name: mp-probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in negosyodepot.com www.negosyodepot.com; do
            echo "=== $h"; dig +short A $h; dig +short CNAME $h; dig +short NS negosyodepot.com
            curl -sS -I -m 20 https://$h | grep -iE '^HTTP|^server|^x-powered|^location|^x-vercel|^set-cookie|^link' || true
          done
          curl -sSL -m 20 https://www.negosyodepot.com/ -o nd.html || curl -sSL -m 20 https://negosyodepot.com/ -o nd.html
          grep -oiE '<title>[^<]*|<meta name="generator"[^>]*>|wp-content|woocommerce|cdn\.shopify|_next/static|supabase\.co|login|sign[ -]?in|my-account|wp-login' nd.html | sort | uniq -c | head -25
