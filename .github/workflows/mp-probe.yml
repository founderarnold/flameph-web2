name: mp-probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "Paano ko ipe-presyo ang homemade na ube jam ko?" "Saan makakabili ng packaging para sa coffee?" "Paano mag-register ng BMBE?"; do
            echo "=== $q"
            curl -sS -m 40 -X POST https://www.flameph.org/api/marketplace/products -H 'content-type: application/json' --data "{\"question\":\"$q\",\"answer\":\"\"}" | head -c 1500; echo
          done
          echo "=== search page sample"
          curl -sSL -m 20 "https://www.marketplaceph.com/search?q=ube" | grep -oE '/listing/[0-9a-f-]{36}' | sort -u | head -3
